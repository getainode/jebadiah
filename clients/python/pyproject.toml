[project]
name = "jebadiah-decide"
version = "0.2.0"
description = "Typed decisions from a Jebadiah model on your own runtime: llama-server, Ollama, LM Studio, vLLM, MLX or a /v1/systemone server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Jason Brashear" }]
keywords = ["jebadiah", "decision-model", "system-one", "llama.cpp", "ollama", "lm-studio", "vllm", "mlx"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  # the tokenizer and chat template only: no transformers, no torch
  "tokenizers>=0.21",
  "jinja2>=3.1",
  "huggingface-hub>=0.30",
]

[project.optional-dependencies]
mlx = ["mlx-lm>=0.31"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/getainode/jebadiah"
Guide = "https://github.com/getainode/jebadiah/blob/main/docs/run-locally.md"

[project.scripts]
jeb = "jebadiah_decide.cli:main"
jebadiah-decide = "jebadiah_decide.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jebadiah_decide"]

[tool.pytest.ini_options]
testpaths = ["tests"]
