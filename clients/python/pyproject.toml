[project]
name = "jebadiah-decide"
version = "0.1.0"
description = "Typed decisions from a Jebadiah model on your own runtime: llama-server, Ollama, LM Studio, vLLM, MLX or a /v1/systemone server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Jason Brashear" }]
keywords = ["jebadiah", "decision-model", "system-one", "llama.cpp", "ollama", "lm-studio", "vllm", "mlx"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
# rendering the prompt locally (every backend except systemone and mlx): the tokenizer only, no torch
render = ["transformers>=4.51", "huggingface-hub>=0.30", "jinja2>=3.1"]
mlx = ["mlx-lm>=0.31", "huggingface-hub>=0.30"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/getainode/jebadiah"
Guide = "https://github.com/getainode/jebadiah/blob/main/docs/run-locally.md"

[project.scripts]
jebadiah-decide = "jebadiah_decide.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jebadiah_decide"]

[tool.pytest.ini_options]
testpaths = ["tests"]
